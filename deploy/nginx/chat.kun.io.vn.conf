# /etc/nginx/sites-available/chat.kun.io.vn  (symlink into sites-enabled)
# Nimbo: /api and /socket.io → API container, everything else → web container.
# Both containers listen on 127.0.0.1 only (see /opt/nimbo/docker-compose.yml).
#
# Same flow as the portfolio: install this file as-is (port 80 only), then run
#   certbot --nginx -d chat.kun.io.vn
# certbot moves this server to 443 with the Let's Encrypt certificate and adds the 80 → 443 redirect.

# Unique names so they can't clash with maps/upstreams of other sites on this server.
map $http_upgrade $nimbo_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nimbo_api {
    server 127.0.0.1:5100;
    keepalive 16;
}

upstream nimbo_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    server_name chat.kun.io.vn;

    server_tokens off;
    # The app accepts files up to 20 MB; nginx's default limit is only 1 MB.
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Calls need the camera/microphone (and screen share) of this site only.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Note: proxy_set_header is NOT inherited into a location that sets its own headers,
    # so each location repeats the full set.

    # Realtime (Socket.IO over WebSocket): keep connections open.
    location /socket.io/ {
        proxy_pass http://nimbo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr; # real visitor IP (cloudflare-realip.conf)
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nimbo_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://nimbo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://nimbo_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
