# Local development only: Redis for `npm run dev`.  Production lives in deploy/docker-compose.yml.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379' # loopback only, never expose Redis on a network
    volumes:
      - redis-data:/data

volumes:
  redis-data:
